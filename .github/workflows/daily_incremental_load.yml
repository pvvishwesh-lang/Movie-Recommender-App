name: Daily Incremental Load
on: 
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  incremental:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v3
                - name: Set up Python
                  uses: actions/setup-python@v4
                  with: 
                        python-version: '3.11'
                - name: Install dependencies
                  run: pip install sentence-transformers qdrant-client requests
                - name: Run incremental load
                  env:
                      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
                      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
                      CLUSTER_ENDPOINT: ${{ secrets.CLUSTER_ENDPOINT }}
                  run: python pipeline/incr_load.py
