name: Render Deployment
on: 
  workflow_run: 
    workflows: ["Backend Tests"]
    types: 
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
       - uses: actions/checkout@v3
       - name: Create .env file
         run: |
            echo "VITE_API_KEY=${{ secrets.VITE_API_KEY }}" >> .env
            echo "QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}" >> .env
            echo "CLUSTER_ENDPOINT=${{ secrets.CLUSTER_ENDPOINT }}" >> .env
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
            echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
       - name: Sync secrets to Render
         uses: aasmal97/RenderSecretsSync@v1.1.0
         with:
              ENV_FILE_PATH: "./.env"
              RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
              RENDER_SERVICE_NAME: "Movie-Recommender-App-1"
       - name: Wait for Render to start deploy
         run: sleep 10
       - name: Deploy to Render
         uses: JorgeLNJunior/render-deploy@v1.5.0
         with: 
           service_id: ${{ secrets.RENDER_SERVICE_ID }}
           api_key: ${{ secrets.RENDER_API_KEY }}
           wait_deploy: true
           clear_cache: false
        
  
  
    
